{% extends 'base.html' %}

{% block titulo %}Nova Tarefa{% endblock %}

{% block conteudo %}
    <h2>Cadastrar Nova Tarefa</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="campo">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" maxlength="100" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" required></textarea>
        </div>

        <div class="campo">
            <label for="data_entrega">Data de entrega:</label>
            <input type="date" id="data_entrega" name="data_entrega" required>
        </div>

        <div class="campo">
            <label for="projeto">Projeto relacionado:</label>
            <select id="projeto" name="projeto" required>
                <option value="">Selecione um projeto</option>
                {% for projeto in projetos %}
                    <option value="{{ projeto.id }}">{{ projeto.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Salvar Tarefa</button>
        <a class="botao" href="{% url 'lista_tarefas' %}">Cancelar</a>
    </form>
{% endblock %}
