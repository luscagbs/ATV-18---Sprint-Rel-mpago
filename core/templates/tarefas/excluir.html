{% extends 'base.html' %}

{% block titulo %}Excluir Tarefa{% endblock %}

{% block conteudo %}
    <h2>Excluir Tarefa</h2>

    <div class="aviso">
        Tem certeza de que deseja excluir a tarefa
        <strong>{{ tarefa.titulo }}</strong>?

        <p><strong>Projeto:</strong> {{ tarefa.projeto }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, excluir tarefa</button>
        <a class="botao" href="{% url 'lista_tarefas' %}">Cancelar</a>
    </form>
{% endblock %}
