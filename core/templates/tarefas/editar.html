{% extends 'base.html' %}

{% block titulo %}Editar Tarefa{% endblock %}

{% block conteudo %}
    <h2>Editar Tarefa</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="campo">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo"
                   value="{{ tarefa.titulo }}" maxlength="100" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" required>{{ tarefa.descricao }}</textarea>
        </div>

        <div class="campo">
            <label for="data_entrega">Data de entrega:</label>
            <input type="date" id="data_entrega" name="data_entrega"
                   value="{{ tarefa.data_entrega|date:'Y-m-d' }}" required>
        </div>

        <div class="campo">
            <label for="projeto">Projeto relacionado:</label>
            <select id="projeto" name="projeto" required>
                {% for projeto in projetos %}
                    <option value="{{ projeto.id }}"
                        {% if projeto.id == tarefa.projeto.id %}selected{% endif %}>
                        {{ projeto.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Salvar Alterações</button>
        <a class="botao" href="{% url 'lista_tarefas' %}">Cancelar</a>
    </form>
{% endblock %}
