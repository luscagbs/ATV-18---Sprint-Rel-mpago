<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gerenciador de Projetos{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #263247;
        }

        header {
            background: #243b64;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            margin: 0 0 14px;
            font-size: 25px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
        }

        a, button {
            cursor: pointer;
        }

        main a {
            color: #2457a7;
        }

        .botao, button {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .botao:hover, button:hover {
            background: #193e7c;
        }

        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e1e6ef;
            text-align: left;
        }

        th {
            background: #edf2fa;
        }

        form {
            max-width: 650px;
        }

        label {
            display: inline-block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd3df;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .campo {
            margin-bottom: 18px;
        }

        .aviso {
            padding: 14px;
            background: #fff4db;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        @media (max-width: 600px) {
            main {
                margin: 18px 10px;
                padding: 18px;
                overflow-x: auto;
            }

            header {
                padding: 20px;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Gerenciador de Projetos e Tarefas</h1>
        <nav>
            <a href="{% url 'lista_projetos' %}">Projetos</a>
            <a href="{% url 'lista_tarefas' %}">Tarefas</a>
        </nav>
    </header>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>
</body>
</html>
