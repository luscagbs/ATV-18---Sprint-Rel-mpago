
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar projeto</title>
</head>
<body>
    <h1>Editar projeto</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"
               value="{{ projeto.nome }}" maxlength="100" required>
        <br><br>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" required>{{ projeto.descricao }}</textarea>
        <br><br>

        <label for="data_inicio">Data de início:</label>
        <input type="date" id="data_inicio" name="data_inicio"
               value="{{ projeto.data_inicio|date:'Y-m-d' }}" required>
        <br><br>

        <button type="submit">Salvar alterações</button>
    </form>

    <a href="{% url 'lista_projetos' %}">Voltar para projetos</a>
</body>
</html>
