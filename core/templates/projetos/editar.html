
{% extends 'base.html' %}

{% block titulo %}Editar Projeto{% endblock %}

{% block conteudo %}
    <h2>Editar Projeto</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="campo">
            <label for="nome">Nome do projeto:</label>
            <input type="text" id="nome" name="nome"
                   value="{{ projeto.nome }}" maxlength="100" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" required>{{ projeto.descricao }}</textarea>
        </div>

        <div class="campo">
            <label for="data_inicio">Data de início:</label>
            <input type="date" id="data_inicio" name="data_inicio"
                   value="{{ projeto.data_inicio|date:'Y-m-d' }}" required>
        </div>

        <button type="submit">Salvar Alterações</button>
        <a class="botao" href="{% url 'lista_projetos' %}">Cancelar</a>
    </form>
{% endblock %}
