
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projetos</title>
</head>
<body>
    <h1>Projetos cadastrados</h1>

    <a href="{% url 'novo_projeto' %}">Novo projeto</a>

    {% for projeto in projetos %}
        <h2>{{ projeto.nome }}</h2>
        <p>{{ projeto.descricao }}</p>
        <p>Data de início: {{ projeto.data_inicio }}</p>
    {% empty %}
        <p>Nenhum projeto cadastrado.</p>
    {% endfor %}
</body>
</html>
