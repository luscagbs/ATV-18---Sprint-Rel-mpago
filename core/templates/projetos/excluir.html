
{% extends 'base.html' %}

{% block titulo %}Excluir Projeto{% endblock %}

{% block conteudo %}
    <h2>Excluir Projeto</h2>

    <div class="aviso">
        Tem certeza de que deseja excluir o projeto
        <strong>{{ projeto.nome }}</strong>?
        <p>Atenção: as tarefas relacionadas a este projeto também serão excluídas.</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, excluir projeto</button>
        <a class="botao" href="{% url 'lista_projetos' %}">Cancelar</a>
    </form>
{% endblock %}
