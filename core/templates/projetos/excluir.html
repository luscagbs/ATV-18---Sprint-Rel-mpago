
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir projeto</title>
</head>
<body>
    <h1>Excluir projeto</h1>

    <p>Tem certeza de que deseja excluir o projeto "{{ projeto.nome }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
    </form>

    <a href="{% url 'lista_projetos' %}">Cancelar</a>
</body>
</html>
